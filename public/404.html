<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Página no encontrada · Pablo Rojo Hernández</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="color-scheme" content="light dark" />
    <style>
      :root {
        --bg: #fcf9f4;
        --text: #2a1e25;
        --muted: #5e4c55;
        --accent: #3d2c35;
        --accent-text: #fcf9f4;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1b1418;
          --text: #efe6dc;
          --muted: #c1b0b8;
          --accent: #e9d4bb;
          --accent-text: #2a1e25;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--text);
        font-family: 'Avenir Next', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
        padding: 1.5rem;
      }
      .code {
        font-size: clamp(4rem, 18vw, 8rem);
        font-weight: 600;
        line-height: 1;
        margin: 0;
        color: var(--accent);
        letter-spacing: -0.04em;
      }
      p {
        color: var(--muted);
        max-width: 28rem;
        margin: 1rem auto 2rem;
      }
      a {
        display: inline-block;
        padding: 0.8rem 1.4rem;
        border-radius: 999px;
        background: var(--accent);
        color: var(--accent-text);
        font-weight: 600;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 3px solid #b5577f;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 class="code">404</h1>
      <p>
        Esta página no existe.<br />
        <span lang="en">This page doesn’t exist.</span>
      </p>
      <a href="/">Volver al inicio · <span lang="en">Back home</span></a>
    </main>
  </body>
</html>
